name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  CLOUDFLARE_PROJECT_NAME: flowbills

permissions:
  contents: read
  security-events: write

jobs:

  deployment-provider-guard:
    runs-on: ubuntu-latest
    name: 🧭 Deployment Provider Guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject legacy deployment artifacts
        run: |
          set -euo pipefail
          git ls-files | sed 's#^#/#' | awk '
            /\/(now\.json|netlify\.toml)$/ { bad=1; print "::error::legacy host config still tracked: " $0 }
            /\/\.vercel\// { bad=1; print "::error::legacy provider directory still tracked: " $0 }
            END { exit bad }
          '

      - name: Require Vercel Git kill switch
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'vercel.json';
          if (!fs.existsSync(configPath)) {
            console.error('::error::vercel.json kill switch is required while the external Vercel GitHub App remains attached.');
            process.exit(1);
          }
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          if (config?.git?.deploymentEnabled !== false) {
            console.error('::error::vercel.json must set git.deploymentEnabled=false to stop Vercel Git deployments.');
            process.exit(1);
          }
          if (config?.github?.enabled !== false) {
            console.error('::error::vercel.json must set github.enabled=false as a compatibility kill switch.');
            process.exit(1);
          }
          console.log('Vercel Git deployment kill switch is active.');
          NODE

  # Quality Gates
  lint-and-format:
    runs-on: ubuntu-latest
    name: 🔍 Code Quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (fail on errors only for incident hotfix)
        run: npm run lint -- --max-warnings=999 || (echo "::warning::ESLint warnings detected but continuing (incident hotfix policy)" && exit 0)
        continue-on-error: false

      - name: Check TypeScript
        run: npm run type-check || npx tsc --noEmit
        continue-on-error: false

      - name: Check formatting
        run: npm run format:check || echo "Format check warnings - non-blocking"
        continue-on-error: true

  # Unit and Integration Tests
  test:
    runs-on: ubuntu-latest
    name: 🧪 Tests
    needs: [deployment-provider-guard, lint-and-format]

    strategy:
      matrix:
        test-type: [unit, integration]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: npm run test:unit

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: npm run test:integration

      - name: Upload coverage to Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # Performance Testing
  performance:
    runs-on: ubuntu-latest
    name: ⚡ Performance
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Security Scan
  security:
    runs-on: ubuntu-latest
    name: 🔒 Security
    needs: [deployment-provider-guard, lint-and-format]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate

  # Build and Deploy to Cloudflare
  build-and-deploy:
    runs-on: ubuntu-latest
    name: 🚀 Build & Deploy Cloudflare
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment variables
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::error::Missing required secret: VITE_SUPABASE_URL"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "::error::Missing required secret: VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing required secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN_FLOW }}" ]; then
            echo "::error::Missing required secret: CLOUDFLARE_API_TOKEN_FLOW"
            exit 1
          fi
          echo "✅ All required environment variables are set"

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Run production tests
        run: npm run test:prod

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > /tmp/flowbills-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/flowbills-preview.log
              echo "::error::Vite preview server did not become ready"
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173
        continue-on-error: false

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler pages deploy dist --project-name "${CLOUDFLARE_PROJECT_NAME}" --branch main
          echo "url=https://${CLOUDFLARE_PROJECT_NAME}.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_FLOW }}

  # Database Backup
  backup:
    runs-on: ubuntu-latest
    name: 💾 Database Backup
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight check - Validate required secrets
        run: |
          MISSING_SECRETS=()
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            MISSING_SECRETS+=("SUPABASE_DB_URL")
          fi
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            MISSING_SECRETS+=("AWS_ACCESS_KEY_ID")
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            MISSING_SECRETS+=("AWS_SECRET_ACCESS_KEY")
          fi
          if [ -z "${{ secrets.BACKUP_BUCKET }}" ]; then
            MISSING_SECRETS+=("BACKUP_BUCKET")
          fi
          
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "::error::Missing required secrets for backup job: ${MISSING_SECRETS[*]}"
            echo "::warning::Backup job will be skipped. Please configure the following secrets in repository settings:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            exit 1
          fi
          echo "✅ All required secrets for backup are configured"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create database backup
        run: |
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --file "backup-$(date +%Y%m%d-%H%M%S).sql"
        continue-on-error: true

      - name: Upload backup to S3
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Sync backup to S3
        run: |
          aws s3 cp backup-*.sql s3://${{ secrets.BACKUP_BUCKET }}/database/
        continue-on-error: true
          
  # Notify on Success/Failure
  notify:
    runs-on: ubuntu-latest
    name: 📢 Notifications
    needs: [build-and-deploy, backup]
    if: always()

    steps:
      - name: Send Slack notification
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            STATUS_EMOJI="✅"
            if [ "${{ job.status }}" != "success" ]; then
              STATUS_EMOJI="❌"
            fi
            PAYLOAD=$(cat <<EOF
            {
              "text": "${STATUS_EMOJI} CI/CD Pipeline: ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*CI/CD Pipeline Status*\nStatus: ${{ job.status }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
            EOF
            )
            curl -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo "Slack notification sent"
          else
            echo "SLACK_WEBHOOK_URL not configured - skipping notification"
          fi
